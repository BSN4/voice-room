<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice room</title>
<!-- The SDK's modules, fetched at once rather than one import at a time. -->
<link rel="modulepreload" href="sdk/voice.js">
<link rel="modulepreload" href="sdk/audio.js">
<link rel="modulepreload" href="sdk/call.js">
<link rel="modulepreload" href="sdk/client.js">
<link rel="modulepreload" href="sdk/sessions.js">
<link rel="modulepreload" href="sdk/background.js">
<link rel="modulepreload" href="sdk/decoders.js">
<link rel="modulepreload" href="sdk/frames.js">
<link rel="modulepreload" href="sdk/ids.js">
<link rel="modulepreload" href="sdk/link.js">
<link rel="modulepreload" href="sdk/moderation.js">
<link rel="modulepreload" href="sdk/person.js">
<link rel="modulepreload" href="sdk/refusals.js">
<link rel="modulepreload" href="sdk/regions.js">
<link rel="modulepreload" href="sdk/relays-builtin.js">
<link rel="modulepreload" href="sdk/room.js">
<link rel="modulepreload" href="sdk/seats.js">
<link rel="modulepreload" href="sdk/shared.js">
<link rel="modulepreload" href="sdk/tokens.js">
<!-- And both WebAssembly modules, from the first byte of the page rather than once the modules
     have run: crossorigin, as the SDK's fetch() asks for them in CORS mode. The denoiser, 225 KB
     the call does not wait for, comes after the rest. -->
<link rel="preload" href="sdk/voice.wasm" as="fetch" crossorigin>
<link rel="preload" href="sdk/denoise.wasm" as="fetch" crossorigin fetchpriority="low">
<style>
  /* One column, one job: get into the call and see who is talking. */
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #16181d; --muted: #5d636f; --line: #dde1e7;
    --accent: #2459d6; --accent-ink: #ffffff; --talk: #1f9d55; --bad: #b42318; --bad-bg: #fdecea;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216; --panel: #191c22; --ink: #e9ebef; --muted: #9aa1ad; --line: #2a2f38;
      --accent: #6d95ff; --accent-ink: #0b1020; --talk: #3fd07f; --bad: #ff8a7a; --bad-bg: #3a1714;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); }
  .app { max-width: 560px; margin: 0 auto; padding-block: 32px 48px; padding-inline: 16px; display: grid; gap: 16px; }
  .title { font-size: 24px; font-weight: 700; line-height: 1.25; margin: 0; text-wrap: balance; }
  .room { color: var(--muted); margin: 2px 0 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
  #status { margin: 0; font-size: 15px; }
  #status.bad { color: var(--bad); background: var(--bad-bg); padding: 10px 12px; border-radius: 10px; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    padding: 11px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: 600 15px var(--font); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding-inline: 26px; }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
  .mic { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
  .meter { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--talk); transition: width 80ms linear; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .person {
    border: 2px solid var(--line); border-radius: 12px; padding: 14px 10px; text-align: center;
    transition: border-color 120ms, box-shadow 120ms;
  }
  .person.talking { border-color: var(--talk); box-shadow: 0 0 0 4px color-mix(in srgb, var(--talk) 22%, transparent); }
  .person .name { font-weight: 600; }
  .person .what { font-size: 13px; color: var(--muted); }
  .person .role { font-size: 12px; color: var(--muted); text-transform: capitalize; }
  .person .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
  .person .acts button { padding: 5px 9px; font-size: 12px; border-radius: 8px; }
  .notice { font-size: 14px; color: var(--muted); margin: 0; }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  pre { font: 12px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0 0; }
  @media (prefers-reduced-motion: reduce) { .meter > div, .person { transition: none; } }
</style>
</head>
<body>
<!-- An app, not an article: plain divs, and the log in the page only while its details are open,
     so Safari's Reader (and its Summarize button) finds no text to offer. -->
<div class="app" role="application" aria-label="Voice room">
  <div>
    <div class="title">Voice room</div>
    <div id="room" class="room">Open the room’s link to join.</div>
  </div>

  <div class="card">
    <div id="status" role="status" aria-live="polite">Loading…</div>
    <div class="buttons">
      <button id="join" class="primary" disabled>Join the call</button>
      <button id="mute" hidden>Mute</button>
      <button id="filter" hidden>Noise filter: on</button>
      <button id="openmic" hidden>Use your microphone</button>
      <button id="leave" hidden>Leave</button>
    </div>
    <div id="mic" class="mic" hidden>Your microphone<div class="meter"><div id="me"></div></div></div>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
    <div id="roomacts" class="buttons" hidden>
      <button id="lock">Lock the room</button>
      <button id="end" hidden>End the room</button>
    </div>
  </div>

  <div class="card" id="peoplecard" hidden>
    <div id="people" class="people"></div>
    <div id="alone" class="hint" hidden>Nobody else is here yet. Send them this page’s link.</div>
  </div>

  <details id="details">
    <summary>Details and log</summary>
    <pre id="stats"></pre>
    <div class="buttons" style="margin-top:10px"><button id="copy">Copy log</button><span id="copied" class="hint" hidden>Copied</span></div>
    <pre id="log"></pre>
  </details>
</div>

<script type="module">
// The example app: a page that draws a call and nothing else. Everything the call does, from
// choosing relays to filtering noise, is the web SDK's (sdk/voice.js, ADR 0024).
//
// The link is the page's address, then '#', then what lets its holder in: the room's invite (ADR
// 0016), a person's token, or a tenant's join token (ADR 0023). The browser never sends what
// follows '#' to any server. The relays are ours, as the SDK fetches them from ax.fr.sa, unless
// the address names a list on this page's own site, '?relays=relays.json' beside it, as the labs'
// links do (lab/local.sh, lab/control.sh, lab/local-tenants.sh, lab/aws.sh call). Add '&tone' after the invite to send a 440 Hz tone
// instead of the microphone, for testing, and '&webaudio' to leave out what keeps a call going in
// Safari's background (ADR 0019).
import { prepare, readLink } from './sdk/voice.js';

const SILENT_DB = 60;            // the meter's floor: quieter than -60 dBFS shows nothing
const $ = (id) => document.getElementById(id);
const why = (error) => (error && (error.message || error.name)) || String(error);

let ready = null;                // what prepare() loaded
let call = null;                 // the call, or the last one, for its numbers
let waiting = false;             // waiting for a seat, as the call last said

// The page's log: what happened, when, with the browser's own words for errors. Under
// "Details and log", to copy and send; the console has it too. The SDK writes most of it.
const lines = [];
function note(text) {
  const line = `${new Date().toISOString().slice(11, 23)} ${text}`;
  lines.push(line);
  if (lines.length > 400) lines.shift();
  console.info(`[voice] ${line}`);
  if ($('details').open) $('log').textContent = lines.join('\n');
}
// The log and the numbers are in the page only while their details are open: a page full of
// text is one Safari takes for an article. The numbers are drawn only then.
let numbers = null;
$('details').addEventListener('toggle', () => {
  $('log').textContent = $('details').open ? lines.join('\n') : '';
  $('stats').textContent = '';
  clearInterval(numbers);
  numbers = $('details').open ? setInterval(drawNumbers, 100) : null;
});
// Nothing fails unseen: any error the page did not catch goes into the log too.
addEventListener('error', (event) => note(`page error: ${event.message}`));
addEventListener('unhandledrejection', (event) => note(`page error: ${why(event.reason)}`));

function show(text, bad = false) {
  $('status').textContent = text;
  $('status').className = bad ? 'bad' : '';
}

// What the page says itself goes in the log too, when it changes; the call notes its own.
function say(text, bad = false) {
  if ($('status').textContent !== text) note(text);
  show(text, bad);
}

$('join').onclick = async () => {
  $('join').disabled = true;
  say(ready.test.tone ? 'Starting the test tone…' : 'Asking for your microphone…');
  try {
    // Before anything waits, so it is still the click's: WebKit is told this is a call.
    call = await ready.join();
  } catch (error) {
    $('join').disabled = false;
    return say(error.message, true);
  }
  call.addEventListener('state', ({ detail }) => drawState(detail));
  call.addEventListener('people', drawPeople);
  call.addEventListener('talking', drawTalking);
  call.addEventListener('mute', drawMute);
  call.addEventListener('filter', drawFilter);
  // Roles, mutes by force, the lock and seats (ADR 0028): what the room's origin says, drawn.
  call.addEventListener('role', drawPeople);
  call.addEventListener('forced-mute', drawNotice);
  call.addEventListener('room', drawPeople);
  call.addEventListener('seat', ({ detail }) => {
    waiting = detail.waiting;
    drawNotice();
  });
  call.addEventListener('microphone', ({ detail }) => drawMicrophone(detail));
  $('join').hidden = true;
  $('leave').hidden = false;
  $('peoplecard').hidden = false;
  drawMicrophone({ available: call.microphone, reason: null });
  drawFilter();
  // The call may be in, its room's people known, before join() resolves: as the relay is joined
  // while the microphone is asked for. What it said before the listeners came is read here.
  drawState(call.state);
  drawPeople();
  drawNotice();
};

// The microphone: a listener's call has none, nothing to mute and no meter, until a moderator
// lifts its mute by force; then the SDK asks for it, and where the browser wants a click, says so.
function drawMicrophone({ available, reason }) {
  $('mic').hidden = !available;
  $('mute').hidden = !available;
  $('openmic').hidden = available || reason === null;
  $('openmic').textContent = reason === 'needs-click' ? 'Use your microphone' : 'Try the microphone again';
  if (!available && reason !== null && reason !== 'needs-click') say('The microphone did not open. You can still listen.', true);
  drawMute();
  if (available) {
    meter.shown = -1;
    requestAnimationFrame(drawMeter);
  }
}

// In the click, so the browser lets it ask (ADR 0028).
$('openmic').onclick = () => call.openMicrophone();

// What keeps this page from being heard, besides its own mute: a moderator's, or every seat busy.
function drawNotice() {
  const notice = $('notice');
  let text = '';
  if (call.forcedMute) text = 'A moderator has muted you. They can let you talk again.';
  else if (waiting) text = 'Every seat is taken. Waiting for one…';
  notice.textContent = text;
  notice.hidden = !text;
  drawTalking();
}


// The microphone's meter, read from the call as the page draws, while the call goes on. The bar
// moves in whole percents, and a frame whose percent is unchanged writes nothing.
const meter = { mic: $('mic'), bar: $('me'), shown: -1 };
function drawMeter() {
  if (meter.mic.hidden) return;
  const width = call.muted ? 0 : Math.max(0, Math.round(100 - call.level * 100 / SILENT_DB));
  if (width !== meter.shown) {
    meter.shown = width;
    meter.bar.style.width = `${width}%`;
  }
  requestAnimationFrame(drawMeter);
}

$('leave').onclick = () => {
  note('you pressed Leave');
  call.leave();
};
$('mute').onclick = () => call.mute(!call.muted);
// The noise filter's switch (ADR 0022): the SDK applies it at once and this device remembers it.
$('filter').onclick = () => call.setFilter(!call.filter.on);

function drawState({ state, message, bad }) {
  show(message, bad);
  if (state !== 'left' && state !== 'failed') return;
  $('join').hidden = false;
  $('join').disabled = false;
  $('mute').hidden = true;
  $('filter').hidden = true;
  $('leave').hidden = true;
  $('mic').hidden = true;
  $('openmic').hidden = true;
  $('notice').hidden = true;
  $('roomacts').hidden = true;
  $('peoplecard').hidden = true;
  waiting = false;
}

function drawMute() {
  $('mute').textContent = call.muted ? 'Unmute' : 'Mute';
  if (call.muted) $('me').style.width = '0%';
  drawTalking();
}

function drawFilter() {
  const { available, on } = call.filter;
  $('filter').hidden = !available;
  $('filter').textContent = `Noise filter: ${on ? 'on' : 'off'}`;
}

// Roles by rank (ADR 0025). The room's origin decides every action by the actor's verified role;
// the page only shows the buttons a role's actions need, and only on people below it.
const RANK = { speaker: 1, moderator: 2, admin: 3 };
const moderates = () => (RANK[call.role] ?? 0) >= RANK.moderator;
const outranks = (role) => moderates() && (RANK[role] ?? 0) < RANK[call.role];

// An action asked of the room's origin: in the log, and in the status if it is refused.
function act(what, asking) {
  note(`you asked to ${what}`);
  asking.then(() => note(`${what}: done`), (error) => {
    note(`${what}: ${error.reason}`);
    say(error.message, true);
  });
}

function button(text, onclick) {
  const made = document.createElement('button');
  made.textContent = text;
  made.onclick = onclick;
  return made;
}

// Everyone in the room, each with their role, and a moderator's or admin's buttons on those below
// them.
function drawPeople() {
  $('people').replaceChildren(...call.people.map(({ user, role, muted, seat, you, name: called }) => {
    const card = document.createElement('div');
    card.className = 'person';
    card.dataset.seat = seat === null ? '' : String(seat);
    card.dataset.you = you ? '1' : '';
    card.dataset.muted = muted ? '1' : '';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = you ? 'You' : called;
    const what = document.createElement('div');
    what.className = 'what';
    what.textContent = 'Quiet';
    card.append(name);
    if (role) {
      const shown = document.createElement('div');
      shown.className = 'role';
      shown.textContent = role;
      card.append(shown);
    }
    card.append(what);
    if (!you && outranks(role)) {
      const acts = document.createElement('div');
      acts.className = 'acts';
      acts.append(
        button(muted ? 'Let talk' : 'Mute', () => act(`${muted ? 'let talk' : 'mute'} ${called}`, call.forceMute(user, !muted))),
        button('Kick', () => act(`kick ${called}`, call.kick(user))),
        button('Ban', () => act(`ban ${called}`, call.ban(user))),
      );
      if (call.role === 'admin') {
        acts.append(role === 'moderator'
          ? button('Make speaker', () => act(`demote ${called}`, call.demote(user)))
          : button('Make moderator', () => act(`promote ${called}`, call.promote(user))));
      }
      card.append(acts);
    }
    return card;
  }));
  const others = call.people.filter(({ you }) => !you).length + call.others;
  $('alone').hidden = others > 0;
  // The room's own buttons, for moderators and admins: the lock, and an admin's end.
  $('roomacts').hidden = !moderates() || call.state.state === 'left' || call.state.state === 'failed';
  $('lock').textContent = call.locked ? 'Unlock the room' : 'Lock the room';
  $('end').hidden = call.role !== 'admin';
  drawTalking();
}

$('lock').onclick = () => act(call.locked ? 'unlock the room' : 'lock the room', call.lock(!call.locked));
$('end').onclick = () => act('end the room', call.endRoom());

// Who is talking, as the call says: each frame's level, never decoded for it.
function drawTalking() {
  const talking = call.talking;
  for (const card of document.querySelectorAll('.person')) {
    const on = card.dataset.seat !== '' && talking.includes(Number(card.dataset.seat));
    card.classList.toggle('talking', on);
    const muted = card.dataset.muted ? 'Muted by a moderator' : card.dataset.you && call.muted ? 'Muted' : '';
    card.querySelector('.what').textContent = muted || (on ? 'Talking' : 'Quiet');
  }
}

// The numbers, while their details are open.
function drawNumbers() {
  const s = call ? call.stats : {
    relay: null, moves: 0, sent: 0, received: 0, played: 0, lost: 0, late: 0, listed: [],
    relays: ready ? ready.relays : [],
  };
  $('stats').textContent =
    `relay ${s.relay ?? 'none'}, moved ${s.moves} times\n` +
    `sent ${s.sent} frames, received ${s.received}, played ${s.played}, lost ${s.lost}, too late ${s.late}\n` +
    `relays in the list: ${s.listed.join(', ') || 'none yet'}\n` +
    `relays to start from: ${s.relays.join(', ') || 'none'}`;
}

$('copy').onclick = () => {
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    $('copied').hidden = false;
    setTimeout(() => { $('copied').hidden = true; }, 2000);
  }, () => {
    const range = document.createRange();
    range.selectNodeContents($('log'));
    getSelection().removeAllRanges();
    getSelection().addRange(range);
  });
};

// A lab's own relay list, '?relays=…' on this page's site, or none: then ours. A list elsewhere is
// never taken, so a link cannot send the page to relays of someone else's choosing.
function labRelays() {
  const named = new URLSearchParams(location.search).get('relays');
  if (!named) return undefined;
  const url = new URL(named, location.href);
  return url.origin === location.origin ? url.href : undefined;
}

// Before anything: is this a link, and can this browser make the call? The SDK loads what a call
// needs, so Join starts it at once.
async function boot() {
  const link = readLink(location.hash.slice(1));
  if (link) $('room').textContent = `Room ${link.room}`;
  // The link holds one token for the whole call. An app that issues short tokens, of about 10
  // minutes, passes a function instead, and the SDK renews ahead of each expiry, telling the call's
  // `renewed` event (ADR 0024):
  //   prepare({ token: () => fetch('/voice-token').then((r) => r.text()), relaysUrl, log })
  try {
    ready = await prepare({ link: location.hash.slice(1), relaysUrl: labRelays(), log: note });
  } catch (error) {
    return say(error.message, true);
  }
  // Refused by this device's clock: the relays will refuse it. Join stays, in case the clock is
  // wrong.
  if (ready.warning) say(ready.warning.message, true);
  else say('Ready. Press Join and allow the microphone.');
  $('join').disabled = false;
}
boot();
</script>
</body>
</html>
