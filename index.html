<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice room</title>
<style>
  /* One column, one job: get into the call and see who is talking. */
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #16181d; --muted: #5d636f; --line: #dde1e7;
    --accent: #2459d6; --accent-ink: #ffffff; --talk: #1f9d55; --bad: #b42318; --bad-bg: #fdecea;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216; --panel: #191c22; --ink: #e9ebef; --muted: #9aa1ad; --line: #2a2f38;
      --accent: #6d95ff; --accent-ink: #0b1020; --talk: #3fd07f; --bad: #ff8a7a; --bad-bg: #3a1714;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); }
  .app { max-width: 560px; margin: 0 auto; padding-block: 32px 48px; padding-inline: 16px; display: grid; gap: 16px; }
  .title { font-size: 24px; font-weight: 700; line-height: 1.25; margin: 0; text-wrap: balance; }
  .room { color: var(--muted); margin: 2px 0 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
  #status { margin: 0; font-size: 15px; }
  #status.bad { color: var(--bad); background: var(--bad-bg); padding: 10px 12px; border-radius: 10px; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    padding: 11px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); font: 600 15px var(--font); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding-inline: 26px; }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
  .mic { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
  .meter { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--talk); transition: width 80ms linear; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .person {
    border: 2px solid var(--line); border-radius: 12px; padding: 14px 10px; text-align: center;
    transition: border-color 120ms, box-shadow 120ms;
  }
  .person.talking { border-color: var(--talk); box-shadow: 0 0 0 4px color-mix(in srgb, var(--talk) 22%, transparent); }
  .person .name { font-weight: 600; }
  .person .what { font-size: 13px; color: var(--muted); }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  pre { font: 12px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0 0; }
  @media (prefers-reduced-motion: reduce) { .meter > div, .person { transition: none; } }
</style>
</head>
<body>
<!-- An app, not an article: plain divs, and the log in the page only while its details are open,
     so Safari's Reader (and its Summarize button) finds no text to offer. -->
<div class="app" role="application" aria-label="Voice room">
  <div>
    <div class="title">Voice room</div>
    <div id="room" class="room">Open the room’s link to join.</div>
  </div>

  <div class="card">
    <div id="status" role="status" aria-live="polite">Loading…</div>
    <div class="buttons">
      <button id="join" class="primary" disabled>Join the call</button>
      <button id="mute" hidden>Mute</button>
      <button id="leave" hidden>Leave</button>
    </div>
    <div id="mic" class="mic" hidden>Your microphone<div class="meter"><div id="me"></div></div></div>
  </div>

  <div class="card" id="peoplecard" hidden>
    <div id="people" class="people"></div>
    <div id="alone" class="hint" hidden>Nobody else is here yet. Send them this page’s link.</div>
  </div>

  <details id="details">
    <summary>Details and log</summary>
    <pre id="stats"></pre>
    <div class="buttons" style="margin-top:10px"><button id="copy">Copy log</button><span id="copied" class="hint" hidden>Copied</span></div>
    <pre id="log"></pre>
  </details>
</div>

<script type="module">
// ---------------------------------------------------------------------------------------------
// The link is the page's address, then '#', then the room's invite (ADR 0016): one link for
// everyone in the call. The browser never sends what follows '#' to any server. A person's own
// token still works in its place, as older links have it. Which relays to use comes from
// relays.json beside the page, which lab/aws.sh call writes. Add '&tone' after the invite to send
// a 440 Hz tone instead of the microphone, for testing.
//
// With an invite, the page keeps a random person id for this tab, so a reload is the same person
// and gets their seat back, and sends it with the invite. The relay knows the person by a hash of
// it, which room state shows: the page works out the same hash to find itself there.
//
// The wire (ADR 0003): each 20 ms Opus frame is one datagram behind a 9-byte header.
//   0 seat (the relay writes it) | 1-2 seq | 3-6 ts, 48 kHz | 7 level, dB below full scale |
//   8 flags: bit 0 silence, bit 1 error correction, bits 4-7 codec (0 Opus)
// Control frames (ADR 0004) arrive on a one-way stream: a 2-byte length, then the kind. Kind 1,
// room state: room u64, listeners u32, seat count u16, then per seat: seat u8, user u64. Kinds 2,
// the relay list, and 3, a redirect, are the client's (crates/voice-proto, control).
// ---------------------------------------------------------------------------------------------
const RATE = 48000;
const FRAME = 960;               // 20 ms at 48 kHz
const HEADER = 9;
const SILENT_DB = 60;            // a frame quieter than -60 dBFS is silence
const TALKING_DB = 45;           // louder than -45 dBFS lights a person up
const GIVE_UP_MS = 6000;         // a relay that has not let us in by then: try the next
const $ = (id) => document.getElementById(id);

// Capture: 128-sample blocks from the microphone, gathered into 20 ms frames.
const CAPTURE = `
class Capture extends AudioWorkletProcessor {
  constructor() { super(); this.frame = new Float32Array(${FRAME}); this.at = 0; }
  process(inputs) {
    const input = inputs[0] && inputs[0][0];
    if (!input) return true;
    for (let i = 0; i < input.length; i++) {
      this.frame[this.at++] = input[i];
      if (this.at === ${FRAME}) {
        this.port.postMessage(this.frame, [this.frame.buffer]);
        this.frame = new Float32Array(${FRAME});
        this.at = 0;
      }
    }
    return true;
  }
}
registerProcessor('capture', Capture);`;

// Playout: each person's decoded audio, mixed. It also beats the page's 20 ms turns ('turn'),
// on the audio clock: a page in a background tab has its timers slowed, its audio never.
// Each person waits until 40 ms is queued before they play, starts over after running dry,
// and drops their oldest audio past 200 ms.
const PLAYOUT = `
const TARGET = ${FRAME * 2}, MOST = ${FRAME * 10};
class Playout extends AudioWorkletProcessor {
  constructor() {
    super();
    this.seats = new Map();
    this.beat = 0;
    this.port.onmessage = (e) => {
      const { seat, pcm } = e.data;
      let s = this.seats.get(seat);
      if (!s) { s = { chunks: [], at: 0, queued: 0, playing: false }; this.seats.set(seat, s); }
      s.chunks.push(pcm); s.queued += pcm.length;
      while (s.queued - s.at > MOST && s.chunks.length > 1) { s.queued -= s.chunks[0].length; s.chunks.shift(); s.at = 0; }
    };
  }
  process(_, outputs) {
    const out = outputs[0][0];
    out.fill(0);
    for (const s of this.seats.values()) {
      const have = s.queued - s.at;
      if (!s.playing) { if (have >= TARGET) s.playing = true; else continue; }
      for (let i = 0; i < out.length; i++) {
        const chunk = s.chunks[0];
        if (!chunk) { s.playing = false; break; }
        out[i] += chunk[s.at++];
        if (s.at === chunk.length) { s.chunks.shift(); s.queued -= chunk.length; s.at = 0; }
      }
    }
    for (let i = 0; i < out.length; i++) out[i] = Math.max(-1, Math.min(1, out[i]));
    this.beat += out.length;
    if (this.beat >= ${FRAME}) { this.beat -= ${FRAME}; this.port.postMessage('turn'); }
    return true;
  }
}
registerProcessor('playout', Playout);`;

const state = {
  token: null, invite: null, person: null, me: null, room: null, tone: false, relays: [], tried: 0,
  context: null, encoder: null, source: null, stream: null, playout: null,
  muted: false, seq: 0, epoch: 0n, t0: 0, ticking: null, since: 0,
  sessions: new Map(),   // "ip:port" -> { key, ip, port, transport, writer }
  current: null,         // the session the client is joined at, by key
  listed: [],            // the last relay list, for the details
  decoders: new Map(),   // seat -> { decoder, count }
  levels: new Map(),     // seat -> { db, at }
  roomState: null,
  stats: { sent: 0, received: 0, played: 0, lost: 0, late: 0, moves: 0 },
};

function hexBytes(hex) {
  const clean = hex.trim().toLowerCase();
  if (!/^([0-9a-f]{2})+$/.test(clean)) return null;
  return Uint8Array.from(clean.match(/../g), (pair) => parseInt(pair, 16));
}

function say(text, bad = false) {
  if ($('status').textContent !== text) note(text);
  $('status').textContent = text;
  $('status').className = bad ? 'bad' : '';
}

// The page's log: what happened, when, with the browser's own words for errors. Under
// "Details and log", to copy and send; the console has it too.
const lines = [];
function note(text) {
  const line = `${new Date().toISOString().slice(11, 23)} ${text}`;
  lines.push(line);
  if (lines.length > 400) lines.shift();
  console.info(`[voice] ${line}`);
  if ($('details').open) $('log').textContent = lines.join('\n');
}
// The log and the numbers are in the page only while their details are open: a page full of
// text is one Safari takes for an article.
$('details').addEventListener('toggle', () => {
  $('log').textContent = $('details').open ? lines.join('\n') : '';
  $('stats').textContent = '';
});
const why = (error) => (error && (error.message || error.name)) || String(error);
// Nothing fails unseen: any error the page did not catch goes into the log too.
addEventListener('error', (event) => note(`page error: ${event.message}`));
addEventListener('unhandledrejection', (event) => note(`page error: ${why(event.reason)}`));

// The invite or token after '#': alone, or as 'invite=' or 'token='.
function readLink() {
  const fragment = location.hash.slice(1);
  const params = new URLSearchParams(fragment);
  const given = (params.get('invite') ?? params.get('token') ?? fragment.split('&')[0] ?? '').trim();
  state.tone = params.has('tone');
  const fields = hexBytes(given);
  if (!fields) return false;
  const view = new DataView(fields.buffer);
  // An invite's fields: format 2, room 8, expiry 8 (crates/voice-token, invite).
  if (fields.length === 81 && fields[0] === 2) {
    state.invite = given;
    state.room = view.getBigUint64(1);
    return true;
  }
  // A token's: format 1, user 8, room 8, ...
  if (fields.length === 99 && fields[0] === 1) {
    state.token = given;
    state.me = view.getBigUint64(1);
    state.room = view.getBigUint64(9);
    return true;
  }
  return false;
}

// This tab's person id: random, kept for the tab, so a reload is the same person and another
// tab is another. Where the browser keeps nothing, a new one each load.
function personId() {
  const fresh = () => crypto.getRandomValues(new BigUint64Array(1))[0];
  try {
    const kept = sessionStorage.getItem('voice-person');
    if (kept && /^[0-9]{1,20}$/.test(kept) && BigInt(kept) < 2n ** 64n) return BigInt(kept);
    const id = fresh();
    sessionStorage.setItem('voice-person', id.toString());
    return id;
  } catch (_) {
    return fresh();
  }
}

// Who room state says a person with an invite is: the first 8 bytes of SHA-256 over
// 'voice person v1' and the id's 8 bytes (crates/voice-token, person).
async function personHash(id) {
  const context = new TextEncoder().encode('voice person v1');
  const bytes = new Uint8Array(context.length + 8);
  bytes.set(context);
  new DataView(bytes.buffer).setBigUint64(context.length, id);
  return new DataView(await crypto.subtle.digest('SHA-256', bytes)).getBigUint64(0);
}

function missingFeatures() {
  const missing = ['WebTransport', 'AudioEncoder', 'AudioDecoder', 'AudioWorkletNode'].filter((name) => !(name in window));
  if (!(window.crypto && crypto.subtle)) missing.push('crypto.subtle');
  return missing;
}

async function loadRelays() {
  const response = await fetch(`relays.json?at=${Date.now()}`, { cache: 'no-store' });
  if (!response.ok) throw new Error('no relays.json');
  const { relays } = await response.json();
  state.relays = relays.map(({ at, hash }) => {
    const [ip, port] = at.split(':');
    return { ip, port: Number(port), key: at, hash: hexBytes(hash) };
  }).filter((relay) => relay.hash && relay.hash.length === 32);
  if (!state.relays.length) throw new Error('relays.json lists no relay');
}

// ---------------------------------------------------------------------------------------------
// The client (ADRs 0010, 0011): which relay to join, whether it is there, and when to move are
// voice-client's, the Rust the simulator runs, compiled to WebAssembly (crates/voice-web). This
// page only carries out what it says, and tells it what happened.
// ---------------------------------------------------------------------------------------------
const JOIN = 1, LEAVE = 2, PING = 3;
const RELAY_BYTES = 38;          // address 4, port 2, certificate hash 32
// voice-web's jitter buffer: what a push and a turn say (crates/voice-web/src/lib.rs).
const LATE = 2;
const FRAME_OUT = 1, LOST = 2, LOST_WITH_NEXT = 3;
const OPUS_MAX = 1275;
let wasm = null;

async function loadClient() {
  const { instance } = await WebAssembly.instantiateStreaming(fetch('voice.wasm'), {});
  wasm = instance.exports;
}

const shared = (len) => new Uint8Array(wasm.memory.buffer, wasm.buffer(), len);
const clock = () => Math.floor(performance.now() - state.t0) >>> 0;
const ipNumber = (ip) => ip.split('.').reduce((n, part) => (n * 256) + Number(part), 0) >>> 0;
const ipText = (n) => [24, 16, 8, 0].map((shift) => (n >>> shift) & 255).join('.');

// A relay as the buffer carries it: address, port, and for a join, its hash.
function relayInBuffer(withHash) {
  const bytes = shared(RELAY_BYTES).slice();
  const view = new DataView(bytes.buffer);
  const ip = ipText(view.getUint32(0));
  const port = view.getUint16(4);
  return { ip, port, key: `${ip}:${port}`, hash: withHash ? bytes.slice(6) : null };
}

// Tells the client what happened at a session, then does what it says.
function tell(call, session) {
  if (!wasm || !state.ticking) return;
  wasm[call](clock(), ipNumber(session.ip), session.port);
  act();
}

function act() {
  for (let kind = wasm.poll(); kind !== 0; kind = wasm.poll()) {
    const relay = relayInBuffer(kind === JOIN);
    if (kind === JOIN) { note(`client: join ${relay.key}`); open(relay); }
    else if (kind === LEAVE) { note(`client: leave ${relay.key}`); close(relay.key); }
    else if (kind === PING) ping(relay.key);
  }
  const joined = wasm.relay() === 1 ? relayInBuffer(false).key : null;
  if (joined !== state.current) {
    if (state.current && joined) state.stats.moves++;
    state.current = joined;
    if (joined) {
      state.tried = 0;
      say('You are in the call. Talk away.');
    } else {
      state.since = performance.now();
      say('Reconnecting…');
    }
  }
}

// Starts the client at the next relay from relays.json: the first, then the others in turn
// while none lets us in. Once in, the relays' own list takes over.
function startClient() {
  for (const key of [...state.sessions.keys()]) close(key);
  const relay = state.relays[state.tried % state.relays.length];
  note(`starting from ${relay.key}`);
  const first = shared(RELAY_BYTES);
  const view = new DataView(first.buffer, first.byteOffset);
  view.setUint32(0, ipNumber(relay.ip));
  view.setUint16(4, relay.port);
  first.set(relay.hash, 6);
  const seed = new BigUint64Array(1);
  crypto.getRandomValues(seed);
  wasm.start(state.room, 0, seed[0], clock(), 1);
  state.since = performance.now();
  act();
}

// Every 10 ms: the client's clock, and the watch on getting in.
function tick() {
  wasm.tick(clock());
  act();
  if (state.current || performance.now() - state.since < GIVE_UP_MS) return;
  state.tried++;
  if (state.tried >= state.relays.length) {
    say('Can’t reach the voice servers. Your network may block calls: try another network, such as your phone’s hotspot. Still trying…', true);
  } else {
    say('Trying another voice server…');
  }
  startClient();
}

// Opens a session at `relay`: the join. The client hears back when it opens, fails or ends.
function open(relay) {
  if (state.sessions.has(relay.key)) return;
  const who = state.invite ? `invite=${state.invite}&user=${state.person}` : `token=${state.token}`;
  const url = `https://${relay.key}/?${who}&epoch=${state.epoch}`;
  let transport;
  note(`connecting to ${relay.key}`);
  try {
    transport = new WebTransport(url, { serverCertificateHashes: [{ algorithm: 'sha-256', value: relay.hash }] });
  } catch (error) {
    note(`could not start a connection to ${relay.key}: ${why(error)}`);
    return tell('failed', relay);
  }
  const session = { ...relay, transport, writer: null, opened: 0, started: performance.now() };
  state.sessions.set(relay.key, session);
  transport.ready.then(() => {
    session.opened = performance.now();
    note(`connected to ${relay.key}`);
    if (state.sessions.get(relay.key) !== session) return;
    try {
      // Today's WebTransport makes a datagram writer with createWritable(), which is all
      // Safari has; Chrome also keeps the older writable.
      const datagrams = transport.datagrams;
      session.writer = (datagrams.createWritable ? datagrams.createWritable() : datagrams.writable).getWriter();
      readDatagrams(session);
      readStreams(session);
    } catch (error) {
      note(`could not use the session at ${relay.key}: ${why(error)}`);
      return;
    }
    tell('joined', session);
  }, (error) => {
    note(`could not connect to ${relay.key}: ${why(error)}`);
    if (state.sessions.get(relay.key) !== session) return;
    state.sessions.delete(relay.key);
    tell('failed', session);
  });
  transport.closed.then(
    (info) => note(`session at ${relay.key} closed${lasted(session)}: code ${info.closeCode}${info.reason ? `, ${info.reason}` : ''}`),
    (error) => note(session.opened
      ? `session at ${relay.key} broke${lasted(session)}: ${why(error)}`
      : `session at ${relay.key} never became ready: ${why(error)}`),
  ).finally(() => {
    if (state.sessions.get(relay.key) !== session) return;
    state.sessions.delete(relay.key);
    tell('closed', session);
  });
}

const lasted = (session) => session.opened ? ` after ${((performance.now() - session.opened) / 1000).toFixed(1)} s` : '';

function close(key) {
  const session = state.sessions.get(key);
  if (!session) return;
  const waited = ((performance.now() - session.started) / 1000).toFixed(1);
  note(session.opened ? `closing ${key}` : `giving up on ${key}: not ready after ${waited} s`);
  state.sessions.delete(key);
  try { session.transport.close({ closeCode: 0, reason: 'moved' }); } catch (_) { /* never opened */ }
}

// A ping: a datagram shorter than an audio header, which the relay sends straight back.
function ping(key) {
  const session = state.sessions.get(key);
  if (session && session.writer) session.writer.write(new Uint8Array([0])).catch(() => {});
}

async function join() {
  $('join').disabled = true;
  say(state.tone ? 'Starting the test tone…' : 'Asking for your microphone…');
  try {
    await startAudio();
  } catch (error) {
    note(`audio did not start: ${why(error)}`);
    stopAudio();
    $('join').disabled = false;
    return say(micTrouble(error), true);
  }
  note(state.tone ? 'sending a 440 Hz test tone' : `microphone on: ${state.stream.getAudioTracks()[0]?.label || 'unnamed'}`);
  $('mic').hidden = false;
  $('join').hidden = true;
  $('mute').hidden = false;
  $('leave').hidden = false;
  $('peoplecard').hidden = false;
  say('Connecting…');
  state.t0 = performance.now();
  state.tried = 0;
  state.ticking = setInterval(tick, 10);
  startClient();
}

function micTrouble(error) {
  const name = error && error.name;
  if (name === 'NotAllowedError') return 'Your browser blocked the microphone. Click the icon left of the address, allow the microphone, then press Join again.';
  if (name === 'NotFoundError') return 'No microphone found. Connect one, then press Join again.';
  if (name === 'NotReadableError') return 'Another app is using the microphone. Close it, then press Join again.';
  return `Could not start audio: ${(error && error.message) || error}`;
}

async function startAudio() {
  const context = new AudioContext({ sampleRate: RATE, latencyHint: 'interactive' });
  state.context = context;
  const url = (code) => URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
  await context.audioWorklet.addModule(url(CAPTURE));
  await context.audioWorklet.addModule(url(PLAYOUT));
  const playout = new AudioWorkletNode(context, 'playout', { outputChannelCount: [1] });
  playout.connect(context.destination);
  playout.port.onmessage = () => turn();
  state.playout = playout;

  let source;
  if (state.tone) {
    const tone = context.createOscillator();
    tone.frequency.value = 440;
    const gain = context.createGain();
    gain.gain.value = 0.1;
    tone.connect(gain);
    tone.start();
    source = gain;
  } else {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
    });
    state.stream = stream;
    source = context.createMediaStreamSource(stream);
  }
  if (context.state !== 'running') await context.resume();
  const capture = new AudioWorkletNode(context, 'capture', { numberOfInputs: 1, numberOfOutputs: 0 });
  source.connect(capture);
  state.source = source;

  const encoder = new AudioEncoder({
    output: (chunk) => send(chunk),
    error: (error) => say(`Your browser’s audio encoder failed: ${error.message}`, true),
  });
  encoder.configure({
    codec: 'opus', sampleRate: RATE, numberOfChannels: 1, bitrate: 32000,
    opus: { frameDuration: 20000, useinbandfec: true, packetlossperc: 5 },
  });
  state.encoder = encoder;
  state.pendingLevels = [];
  capture.port.onmessage = (e) => {
    const pcm = e.data;
    const db = levelOf(pcm);
    $('me').style.width = state.muted ? '0%' : `${Math.max(0, 100 - db * 100 / SILENT_DB)}%`;
    if (state.muted || encoder.state !== 'configured') return;
    state.pendingLevels.push(db);
    encoder.encode(new AudioData({
      format: 'f32-planar', sampleRate: RATE, numberOfFrames: FRAME, numberOfChannels: 1,
      timestamp: state.seq * 20000, data: pcm,
    }));
  };
}

// dB below full scale of a frame, 0 to 127 (RFC 6464): 0 is the loudest.
function levelOf(pcm) {
  let sum = 0;
  for (let i = 0; i < pcm.length; i++) sum += pcm[i] * pcm[i];
  const rms = Math.sqrt(sum / pcm.length);
  if (rms <= 0) return 127;
  return Math.max(0, Math.min(127, Math.round(-20 * Math.log10(rms))));
}

// A frame goes to the relay the client is joined at; while it moves, still to the old one.
function send(chunk) {
  const db = state.pendingLevels.shift() ?? 127;
  const session = state.current && state.sessions.get(state.current);
  if (!session || !session.writer) return;
  const datagram = new Uint8Array(HEADER + chunk.byteLength);
  const view = new DataView(datagram.buffer);
  const seq = state.seq & 0xffff;
  view.setUint8(0, 0);
  view.setUint16(1, seq);
  view.setUint32(3, (state.seq * FRAME) >>> 0);
  view.setUint8(7, db);
  view.setUint8(8, (db >= SILENT_DB ? 1 : 0) | 2);
  chunk.copyTo(datagram.subarray(HEADER));
  state.seq = (state.seq + 1) >>> 0;
  state.stats.sent++;
  session.writer.write(datagram).catch(() => {});
  wasm.sent(clock());
}

async function readDatagrams(session) {
  const reader = session.transport.datagrams.readable.getReader();
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) return;
      // Anything from the relay shows it is there, a ping's echo included.
      tell('heard', session);
      receive(value);
    }
  } catch (_) { /* the session ended */ }
}

// A speaker's frames go through their jitter buffer in the WebAssembly (crates/voice-audio,
// ADR 0014): put back in order, repeats dropped, and played at a delay that follows the
// network's jitter. While the client moves, the same frame can come from both relays: the
// second is a repeat, or too late.
function receive(datagram) {
  if (datagram.byteLength < HEADER) return;
  const view = new DataView(datagram.buffer, datagram.byteOffset, datagram.byteLength);
  const seat = view.getUint8(0);
  const seq = view.getUint16(1);
  const db = view.getUint8(7);
  state.stats.received++;
  state.levels.set(seat, { db, at: performance.now() });
  if (!state.decoders.has(seat)) state.decoders.set(seat, newSpeaker(seat));
  const opus = datagram.subarray(HEADER);
  if (opus.byteLength > OPUS_MAX) return;
  shared(opus.byteLength).set(opus);
  if (wasm.jitter_push(seat, seq, opus.byteLength, clock()) === LATE) state.stats.late++;
}

// Each 20 ms of audio, each person's turn: a frame to decode, or one lost, played silent for
// now (rebuilding it from the next frame's FEC needs our own Opus decoder), or nothing yet.
function turn() {
  if (!state.ticking) return;
  const now = clock();
  for (const [seat, speaker] of state.decoders) {
    const said = wasm.jitter_pop(seat, now);
    const kind = said & 3;
    if (kind === FRAME_OUT) {
      state.stats.played++;
      decode(speaker, shared(said >>> 2).slice());
    } else if (kind === LOST || kind === LOST_WITH_NEXT) {
      state.stats.lost++;
      state.playout.port.postMessage({ seat, pcm: new Float32Array(FRAME) });
    }
  }
}

function newSpeaker(seat) {
  const decoder = new AudioDecoder({
    output: (audio) => {
      const pcm = new Float32Array(audio.numberOfFrames);
      if (audio.format.startsWith('f32')) {
        audio.copyTo(pcm, { planeIndex: 0 });
      } else {
        const ints = new Int16Array(audio.numberOfFrames);
        audio.copyTo(ints, { planeIndex: 0 });
        for (let i = 0; i < ints.length; i++) pcm[i] = ints[i] / 32768;
      }
      audio.close();
      if (state.playout) state.playout.port.postMessage({ seat, pcm }, [pcm.buffer]);
    },
    error: (error) => say(`Your browser’s audio decoder failed: ${error.message}`, true),
  });
  decoder.configure({ codec: 'opus', sampleRate: RATE, numberOfChannels: 1 });
  return { decoder, count: 0 };
}

function decode(speaker, opus) {
  if (speaker.decoder.state !== 'configured') return;
  speaker.decoder.decode(new EncodedAudioChunk({
    type: 'key', timestamp: (speaker.count++) * 20000, data: opus,
  }));
}

async function readStreams(session) {
  const streams = session.transport.incomingUnidirectionalStreams.getReader();
  try {
    for (;;) {
      const { value, done } = await streams.read();
      if (done) return;
      readFrames(session, value);
    }
  } catch (_) { /* the session ended */ }
}

// The relay's control frames (ADR 0004): a 2-byte length, then the kind and its fields.
async function readFrames(session, stream) {
  const reader = stream.getReader();
  let buffer = new Uint8Array(0);
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) return;
      tell('heard', session);
      const joined = new Uint8Array(buffer.length + value.length);
      joined.set(buffer);
      joined.set(value, buffer.length);
      buffer = joined;
      for (;;) {
        if (buffer.length < 2) break;
        const len = (buffer[0] << 8) | buffer[1];
        if (buffer.length < 2 + len) break;
        controlFrame(session, buffer.subarray(2, 2 + len));
        buffer = buffer.slice(2 + len);
      }
    }
  } catch (_) { /* the session ended */ }
}

// Room state is the page's to draw; the relay list (kind 2) and redirects (kind 3) are the
// client's.
function controlFrame(session, body) {
  if (body[0] === 2 || body[0] === 3) {
    if (body.length > 952) return;
    shared(body.length).set(body);
    const taken = wasm.frame(clock(), ipNumber(session.ip), session.port, body.length);
    if (taken && body[0] === 2) noteRelays(body);
    act();
    return;
  }
  roomState(body);
}

// The list's epoch goes with every join; its relays, into the details.
function noteRelays(body) {
  const view = new DataView(body.buffer, body.byteOffset, body.byteLength);
  const epoch = view.getBigUint64(1);
  if (epoch <= state.epoch) return;
  state.epoch = epoch;
  const relays = [];
  for (let i = 0, at = 10; i < body[9] && at + 47 <= body.length; i++, at += 47) {
    relays.push(`${ipText(view.getUint32(at + 8))}:${view.getUint16(at + 12)}${body[at + 14] ? ' (draining)' : ''}`);
  }
  state.listed = relays;
}

function roomState(body) {
  const view = new DataView(body.buffer, body.byteOffset, body.byteLength);
  if (body.length < 15 || view.getUint8(0) !== 1) return;
  const listeners = view.getUint32(9);
  const count = view.getUint16(13);
  const seats = [];
  for (let i = 0; i < count && 15 + i * 9 + 9 <= body.length; i++) {
    seats.push({ seat: view.getUint8(15 + i * 9), user: view.getBigUint64(16 + i * 9) });
  }
  const before = new Map((state.roomState?.seats ?? []).map(({ user, seat }) => [user, seat]));
  const after = new Map(seats.map(({ user, seat }) => [user, seat]));
  for (const [user, seat] of after) {
    if (before.get(user) === seat) continue;
    note(user === state.me ? `you are in the room, on seat ${seat + 1}` : `${personOn(seat)} came in`);
  }
  for (const [user, seat] of before) {
    if (after.has(user)) continue;
    note(user === state.me ? 'you are out of the room' : `${personOn(seat)} left`);
  }
  state.roomState = { listeners, seats };
  drawPeople();
}

// A person as the page names them: by their seat, counted from 1.
const personOn = (seat) => `Person ${seat + 1}`;

function drawPeople() {
  const room = state.roomState;
  if (!room) return;
  $('people').replaceChildren(...room.seats.map(({ seat, user }) => {
    const card = document.createElement('div');
    card.className = 'person';
    card.dataset.seat = seat;
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = user === state.me ? 'You' : personOn(seat);
    const what = document.createElement('div');
    what.className = 'what';
    what.textContent = 'Quiet';
    card.append(name, what);
    return card;
  }));
  const others = room.seats.filter(({ user }) => user !== state.me).length + room.listeners;
  $('alone').hidden = others > 0;
}

// Who is talking, from each frame's level: neither the relay nor this page decodes for it.
setInterval(() => {
  const now = performance.now();
  for (const card of document.querySelectorAll('.person')) {
    const seat = Number(card.dataset.seat);
    const mine = state.roomState?.seats.find((s) => s.seat === seat)?.user === state.me;
    const level = state.levels.get(seat);
    const talking = mine
      ? !state.muted && Number.parseFloat($('me').style.width || '0') > 25
      : !!level && now - level.at < 300 && level.db < TALKING_DB;
    card.classList.toggle('talking', talking);
    card.querySelector('.what').textContent = mine && state.muted ? 'Muted' : talking ? 'Talking' : 'Quiet';
  }
  if (!$('details').open) return;
  const s = state.stats;
  $('stats').textContent =
    `relay ${state.current ?? 'none'}, moved ${s.moves} times\n` +
    `sent ${s.sent} frames, received ${s.received}, played ${s.played}, lost ${s.lost}, too late ${s.late}\n` +
    `relays in the list: ${state.listed.join(', ') || 'none yet'}\n` +
    `relays to start from: ${state.relays.map((r) => r.key).join(', ') || 'none'}`;
}, 100);

function stopAudio() {
  if (state.encoder && state.encoder.state !== 'closed') state.encoder.close();
  if (state.stream) state.stream.getTracks().forEach((track) => track.stop());
  if (state.context) state.context.close();
  Object.assign(state, { encoder: null, context: null, stream: null, playout: null });
}

function leave() {
  note('you pressed Leave');
  clearInterval(state.ticking);
  state.ticking = null;
  wasm.jitter_clear();
  for (const key of [...state.sessions.keys()]) close(key);
  for (const speaker of state.decoders.values()) if (speaker.decoder.state !== 'closed') speaker.decoder.close();
  state.decoders.clear();
  stopAudio();
  // The frame numbers go on counting: a listener's jitter buffer would take a speaker who starts
  // again from 0 for frames long played, until it saw them start over.
  Object.assign(state, { current: null, roomState: null });
  $('join').hidden = false;
  $('join').disabled = false;
  $('mute').hidden = true;
  $('leave').hidden = true;
  $('mic').hidden = true;
  $('peoplecard').hidden = true;
  say('You left the call.');
}

$('copy').onclick = () => {
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    $('copied').hidden = false;
    setTimeout(() => { $('copied').hidden = true; }, 2000);
  }, () => {
    const range = document.createRange();
    range.selectNodeContents($('log'));
    getSelection().removeAllRanges();
    getSelection().addRange(range);
  });
};

// Every 5 s in a call, the numbers into the log.
setInterval(() => {
  if (!state.ticking) return;
  const s = state.stats;
  note(`in ${state.current ?? 'no relay'}: sent ${s.sent}, received ${s.received}, played ${s.played}, lost ${s.lost}, late ${s.late}`);
}, 5000);

$('join').onclick = join;
$('leave').onclick = leave;
$('mute').onclick = () => {
  state.muted = !state.muted;
  $('mute').textContent = state.muted ? 'Unmute' : 'Mute';
};

// Before anything: is this a link, and can this browser make the call?
async function boot() {
  const missing = missingFeatures();
  if (missing.length) return say('This browser can’t make the call. Open the link in Chrome or Edge on a computer.', true);
  if (!readLink()) return say('This page needs the room’s link. Ask whoever set up the call for it.', true);
  $('room').textContent = `Room ${state.room}`;
  note(`${navigator.userAgent}`);
  if (state.invite) {
    state.person = personId();
    state.me = await personHash(state.person);
    note(`room ${state.room}, by its invite: you are ${state.me.toString(16).padStart(16, '0')} in its room state`);
  } else {
    note(`room ${state.room}, by a token: you are user ${state.me}`);
  }
  try {
    await Promise.all([loadClient(), loadRelays()]);
  } catch (_) {
    return say('The call isn’t set up right now: no voice servers are listed. Ask whoever set it up.', true);
  }
  note(`voice servers: ${state.relays.map((r) => r.key).join(', ')}`);
  say('Ready. Press Join and allow the microphone.');
  $('join').disabled = false;
}
boot();
</script>
</body>
</html>
